name: Weekly P/E monitor email

# Sends the coverage P/E vs 1-year-history email (pe_email.py) to the recipient via
# Brevo, every Saturday at 12:00 UK time. Durable and independent of any Claude session.
#
# GitHub Actions cron is always UTC and does not observe DST, so 12:00 UK moves between
# 11:00 UTC (BST, summer) and 12:00 UTC (GMT, winter). Rather than switch the schedule
# twice a year, we fire on BOTH and let exactly one of them own the day.
#
# The gate deliberately does NOT compare the clock at execution time. This workflow
# originally tested "is it 12:00 in London now", which suppressed every single run: four
# fired, all green, all with the send step skipped, because Actions started them 2h01m to
# 4h33m after their cron time and London was 14:00-16:00 by then. We now gate on WHICH cron
# triggered the run, via github.event.schedule, choosing the one that corresponds to 12:00
# London under the current UK offset — immune to delay, and exactly one qualifies per week.
#
# Requires a repository secret BREVO_API_KEY (Settings -> Secrets and variables ->
# Actions). Without it the send step fails loudly and the run is marked failed.

on:
  schedule:
    - cron: '0 11 * * 6'   # 12:00 UK while BST is in effect (Saturday)
    - cron: '0 12 * * 6'   # 12:00 UK while GMT is in effect (Saturday)
  workflow_dispatch:        # manual trigger for testing / an ad-hoc send

permissions:
  contents: read

concurrency:
  group: pe-email
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3'

      # Proceed only for the cron that means 12:00 London today; a manual
      # (workflow_dispatch) run always proceeds. See the note at the top of this file for why
      # this checks the triggering cron rather than the current time.
      - name: Gate to the 12:00 UK cron
        id: gate
        run: |
          set -euo pipefail
          OFFSET=$(TZ='Europe/London' date +%z)          # +0100 during BST, +0000 during GMT
          if [ "$OFFSET" = "+0100" ]; then WANT='0 11 * * 6'; else WANT='0 12 * * 6'; fi
          GOT='${{ github.event.schedule }}'
          echo "UK offset $OFFSET -> 12:00 UK is cron '$WANT'; this run was triggered by '$GOT'"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$GOT" = "$WANT" ]; then
            echo "proceed=yes" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=no"  >> "$GITHUB_OUTPUT"
            echo "The other cron owns this week — skipping."
          fi

      - name: Send weekly P/E email
        if: steps.gate.outputs.proceed == 'yes'
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: |
          if [ -z "$BREVO_API_KEY" ]; then
            echo "::error::BREVO_API_KEY secret is not set — add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          python pe_email.py --send
